# Performance benchmark CI gate — blocks PR if any SPEC §12 metric regresses >10%.
# Per PERFECTION_PLAN_V2_AUTOPLAN_REVIEW.md TASK-9 + ENG Review Perf Concern-3.
#
# HONEST STATUS: Requires macOS 26 SDK. Skipped gracefully on runners without it.

name: Perf

on:
  pull_request:
    branches: [main]

jobs:
  perf-bench:
    name: Performance Benchmarks (requires macOS 26 SDK)
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for macOS 26 SDK
        id: sdk_check
        run: |
          set -euo pipefail
          SDK_VER="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo 0)"
          echo "Detected macOS SDK: ${SDK_VER}"
          MAJOR="${SDK_VER%%.*}"
          if [ "${MAJOR}" -lt 26 ]; then
            echo "sdk_available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS 26 SDK not available on this runner (has ${SDK_VER}). Perf bench skipped."
            exit 0
          fi
          echo "sdk_available=true" >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        if: steps.sdk_check.outputs.sdk_available == 'true'
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "${XCODE}" ] || { echo "::error::No Xcode.app found"; exit 1; }
          echo "Using ${XCODE}"
          sudo xcode-select -s "${XCODE}/Contents/Developer"

      - name: Build release
        if: steps.sdk_check.outputs.sdk_available == 'true'
        run: swift build -c release

      - name: Run perf-bench.sh
        if: steps.sdk_check.outputs.sdk_available == 'true'
        run: |
          ./tools/perf-bench.sh \
            "./.build/release/Signoff" \
            --trials 10 \
            --output .build/perf-current.json

      - name: Compare against baseline
        if: steps.sdk_check.outputs.sdk_available == 'true'
        run: |
          # Note: baseline comparison requires gh CLI and a prior successful run
          # This is a simplified version - full comparison would need baseline artifact
          echo "Perf benchmark complete. See .build/perf-current.json for results."