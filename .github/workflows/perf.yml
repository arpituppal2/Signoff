# Performance benchmark CI gate — blocks PR if any SPEC §12 metric regresses >10%.
# Per PERFECTION_PLAN_V2_AUTOPLAN_REVIEW.md TASK-9 + ENG Review Perf Concern-3.

name: Perf

on:
  pull_request:
    branches: [main]

jobs:
  perf-bench:
    runs-on: macos-14
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          # Prefer newest installed Xcode; do not hard-code 15.4 (pre-macOS 26).
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "${XCODE}" ]; then
            echo "::error::No Xcode.app found under /Applications"
            exit 1
          fi
          echo "Using ${XCODE}"
          sudo xcode-select -s "${XCODE}/Contents/Developer"
          SDK_VER="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo 0)"
          MAJOR="${SDK_VER%%.*}"
          if [ "${MAJOR}" -lt 26 ]; then
            echo "::error::Signoff requires macOS 26 SDK (Package.swift). This runner has ${SDK_VER}."
            exit 1
          fi

      - name: Cache baseline (read previous main branch metrics)
        run: |
          gh run list --workflow=Perf --branch=main --limit=1 --json databaseId -q '.[0].databaseId' \
            > .build/last_perf_run.txt || echo "no-baseline" > .build/last_perf_run.txt

      - name: Build release
        run: swift build -c release

      - name: Run perf-bench.sh (5 metrics × 10 trials → median)
        run: |
          ./tools/perf-bench.sh \
            "./.build/release/Signoff" \
            --trials 10 \
            --output .build/perf-current.json

      - name: Compare against baseline (regression > 10% = fail)
        run: |
          BASELINE_ID=$(cat .build/last_perf_run.txt)
          if [ "$BASELINE_ID" = "no-baseline" ]; then
            echo "⚠ No baseline yet — first run; passing by default"
            exit 0
          fi
          gh run download "$BASELINE_ID" \
            --name perf-bench \
            --dir .build/perf-baseline/ || true
          if [ ! -f .build/perf-baseline/perf-current.json ]; then
            echo "⚠ Baseline artifact missing — passing"
            exit 0
          fi
          ./tools/perf-compare.sh \
            .build/perf-baseline/perf-current.json \
            .build/perf-current.json \
            --max-regression-pct 10

      - name: Upload current run as next-PR baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: perf-current
          path: .build/perf-current.json
